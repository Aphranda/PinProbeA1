<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 540" width="100%" role="img" aria-label="PinProbe A1 5V 供电路径与首疑失效点">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#687381"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1121f"/>
    </marker>
    <style>
      .bx   { fill:#ffffff; stroke:#1f3864; stroke-width:2; }
      .bxg  { fill:#f4f6fa; stroke:#687381; stroke-width:1.8; }
      .bxd  { fill:#fff8ed; stroke:#d97706; stroke-width:2; stroke-dasharray:7 5; }
      .w    { stroke:#1f3864; stroke-width:2.2; fill:none; }
      .wg   { stroke:#687381; stroke-width:1.8; fill:none; }
      .wd   { stroke:#c1121f; stroke-width:2.2; fill:none; stroke-dasharray:7 5; }
      .t    { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:24px; fill:#172033; text-anchor:middle; }
      .tb   { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:24px; font-weight:700; fill:#172033; text-anchor:middle; }
      .ts   { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:20px; fill:#687381; text-anchor:middle; }
      .tl   { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:24px; font-weight:700; fill:#1f3864; text-anchor:start; }
      .tn   { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:20px; fill:#5b6573; text-anchor:start; }
      .tr   { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:22px; font-weight:700; fill:#c1121f; text-anchor:middle; }
    </style>
  </defs>

  <text class="tl" x="24" y="34">PinProbe A1 · 5V 供电路径与首疑失效点（推断，未实测）</text>

  <!-- 主机通道 -->
  <rect x="24" y="68" width="96" height="36" rx="18" fill="#eef2f9" stroke="#1f3864" stroke-width="1.8"/>
  <text class="tl" x="72" y="93" text-anchor="middle">主机</text>
  <rect class="bx" x="140" y="64" width="230" height="48" rx="4"/>
  <text class="tb" x="255" y="89">USB1 VBUS 5V</text>
  <text class="ts" x="255" y="106">PC 标准口</text>
  <line class="w" x1="370" y1="88" x2="404" y2="88" marker-end="url(#arw)"/>
  <rect class="bx" x="410" y="64" width="150" height="48" rx="4"/>
  <text class="tb" x="485" y="89">U12/U13</text>
  <text class="ts" x="485" y="106">小尺寸 ESD</text>
  <line class="w" x1="560" y1="88" x2="594" y2="88" marker-end="url(#arw)"/>
  <rect class="bx" x="600" y="64" width="150" height="48" rx="4"/>
  <text class="tb" x="675" y="89">U4/U5</text>
  <text class="ts" x="675" y="106">0603 磁珠</text>
  <line class="w" x1="750" y1="88" x2="994" y2="88" marker-end="url(#arw)"/>

  <!-- 从机通道 -->
  <rect x="24" y="156" width="96" height="36" rx="18" fill="#f4f6fa" stroke="#687381" stroke-width="1.8"/>
  <text class="tl" x="72" y="181" text-anchor="middle" fill="#687381">从机</text>
  <rect class="bxg" x="140" y="152" width="130" height="48" rx="4"/>
  <text class="tb" x="205" y="181">VCC12V</text>
  <line class="wg" x1="270" y1="176" x2="304" y2="176" marker-end="url(#arwg)"/>
  <rect class="bxg" x="310" y="152" width="70" height="48" rx="4"/>
  <text class="tb" x="345" y="181">F1</text>
  <line class="wg" x1="380" y1="176" x2="414" y2="176" marker-end="url(#arwg)"/>
  <rect class="bxg" x="420" y="152" width="180" height="48" rx="4"/>
  <text class="tb" x="510" y="178">U2 降压</text>
  <text class="ts" x="510" y="195">L4 2.2uH</text>
  <line class="wg" x1="600" y1="176" x2="634" y2="176" marker-end="url(#arwg)"/>
  <rect class="bxg" x="640" y="152" width="160" height="48" rx="4"/>
  <text class="tb" x="720" y="178">VCC5V_OUT</text>
  <text class="ts" x="720" y="195">C10/C11 22uF</text>
  <line x1="800" y1="176" x2="834" y2="176" stroke="#c1121f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arwr)"/>
  <rect class="bxd" x="840" y="152" width="120" height="48" rx="4"/>
  <text class="tb" x="900" y="178" fill="#a14d00">F2 空贴</text>
  <text class="ts" x="900" y="195">仅从机贴装</text>
  <line x1="960" y1="176" x2="994" y2="176" stroke="#c1121f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arwr)"/>
  <text class="tn" x="140" y="222">12V 侧另有 D3/D5（SMB）、D4（SMA）TVS</text>

  <!-- VCC5V 汇流 -->
  <line class="w" x1="1000" y1="88" x2="1000" y2="270" stroke-width="3.4"/>
  <circle cx="1000" cy="88" r="5" fill="#1f3864"/>
  <circle cx="1000" cy="176" r="5" fill="#1f3864"/>
  <circle cx="1000" cy="234" r="5" fill="#1f3864"/>
  <circle cx="1000" cy="270" r="5" fill="#1f3864"/>
  <text class="tl" x="1016" y="82">VCC5V</text>

  <!-- 输入侧电容 -->
  <line class="w" x1="1000" y1="234" x2="994" y2="234"/>
  <rect class="bx" x="700" y="210" width="290" height="48" rx="4"/>
  <text class="tb" x="845" y="235">C8 1uF ∥ C13 10uF</text>
  <text class="ts" x="845" y="252">输入侧 MLCC · 首疑</text>

  <!-- U3 -->
  <line class="w" x1="1000" y1="270" x2="1048" y2="270" marker-end="url(#arw)"/>
  <rect class="wd" x="1048" y="228" width="264" height="84" rx="5"/>
  <rect class="bx" x="1060" y="240" width="240" height="60" rx="4"/>
  <text class="tb" x="1180" y="267">U3 TPS7A2033</text>
  <text class="ts" x="1180" y="287">IN / EN · VIN max 6.5V</text>
  <text class="tr" x="1180" y="218">首疑失效部位（推断，未实测）</text>

  <!-- 输出链路 -->
  <line class="w" x1="1300" y1="270" x2="1360" y2="270"/>
  <line class="w" x1="1360" y1="270" x2="1360" y2="316"/>
  <rect class="bx" x="1240" y="316" width="240" height="42" rx="4"/>
  <text class="t" x="1360" y="344">C12 1uF ∥ C14 10uF</text>
  <line class="w" x1="1360" y1="358" x2="1360" y2="376" marker-end="url(#arw)"/>
  <rect class="bx" x="1240" y="376" width="240" height="58" rx="4"/>
  <text class="t" x="1360" y="398">L2 磁珠 → VDD3V3</text>
  <text class="ts" x="1360" y="418">CH318（U1.16）</text>

  <!-- 地汇流排 -->
  <line x1="200" y1="455" x2="1480" y2="455" stroke="#172033" stroke-width="2.4"/>
  <text class="tl" x="24" y="463" fill="#172033">GND</text>
  <line class="wg" x1="845" y1="258" x2="845" y2="455"/>
  <line class="wg" x1="1080" y1="300" x2="1080" y2="455"/>
  <line class="wg" x1="1360" y1="434" x2="1360" y2="455"/>

  <!-- 图例 -->
  <line x1="140" y1="505" x2="196" y2="505" stroke="#1f3864" stroke-width="2.4"/>
  <text class="tn" x="210" y="512">已确认连接（网表）</text>
  <line x1="520" y1="505" x2="576" y2="505" stroke="#c1121f" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text class="tn" x="590" y="512">主机配置下断开（F2 空贴）</text>
  <rect x="940" y="492" width="56" height="24" fill="none" stroke="#c1121f" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text class="tn" x="1010" y="512">首疑失效部位（推断）</text>
</svg>
