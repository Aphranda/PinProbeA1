<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" width="100%" role="img" aria-label="主机供电回路">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/>
    </marker>
    <style>
      .bx { fill:#ffffff; stroke:#1f3864; stroke-width:2; }
      .w  { stroke:#1f3864; stroke-width:2.2; fill:none; }
      .wg { stroke:#687381; stroke-width:1.6; fill:none; }
      .wd { stroke:#c1121f; stroke-width:2.4; fill:none; stroke-dasharray:8 5; }
      .t  { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:25px; font-weight:700; fill:#172033; text-anchor:middle; }
      .s  { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:21px; fill:#687381; text-anchor:middle; }
      .h  { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:25px; font-weight:700; fill:#1f3864; text-anchor:start; }
      .net{ font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:23px; font-weight:700; fill:#1f3864; text-anchor:start; }
      .r  { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:23px; font-weight:700; fill:#c1121f; text-anchor:middle; }
    </style>
  </defs>

  <text class="h" x="24" y="24">主机供电回路：仅由 PC USB VBUS 取电（失效机为本回路）</text>

  <rect class="bx" x="24" y="42" width="220" height="60" rx="4"/>
  <text class="t" x="134" y="70">USB1 VBUS 5V</text>
  <text class="s" x="134" y="92">PC 标准口</text>
  <line class="w" x1="244" y1="72" x2="276" y2="72" marker-end="url(#a)"/>
  <rect class="bx" x="280" y="42" width="180" height="60" rx="4"/>
  <text class="t" x="370" y="70">U12/U13</text>
  <text class="s" x="370" y="92">小尺寸 ESD</text>
  <line class="w" x1="460" y1="72" x2="492" y2="72" marker-end="url(#a)"/>
  <rect class="bx" x="496" y="42" width="180" height="60" rx="4"/>
  <text class="t" x="586" y="70">U4/U5</text>
  <text class="s" x="586" y="92">0603 磁珠</text>
  <line class="w" x1="676" y1="72" x2="726" y2="72"/>
  <circle cx="730" cy="72" r="5" fill="#1f3864"/>
  <text class="net" x="742" y="124">VCC5V</text>
  <line class="w" x1="730" y1="72" x2="786" y2="72" marker-end="url(#a)"/>

  <rect class="wd" x="778" y="30" width="354" height="84" rx="5"/>
  <rect class="bx" x="790" y="42" width="330" height="60" rx="4"/>
  <text class="t" x="955" y="70">U3 TPS7A2033</text>
  <text class="s" x="955" y="92">IN / EN · VIN max 6.5V</text>
  <text class="r" x="955" y="155">首疑失效部位：输入级（假设1，未实测）</text>

  <line class="w" x1="1120" y1="72" x2="1156" y2="72"/>
  <circle cx="1160" cy="72" r="5" fill="#1f3864"/>
  <text class="net" x="1172" y="124">3.3V</text>
  <line class="w" x1="1160" y1="72" x2="1214" y2="72" marker-end="url(#a)"/>
  <rect class="bx" x="1218" y="42" width="140" height="60" rx="4"/>
  <text class="t" x="1288" y="79">L2 磁珠</text>
  <line class="w" x1="1358" y1="72" x2="1382" y2="72" marker-end="url(#a)"/>
  <rect class="bx" x="1386" y="42" width="190" height="60" rx="4"/>
  <text class="t" x="1481" y="68">CH318（U1.16）</text>
  <text class="s" x="1481" y="90">VDD3V3</text>

  <line class="wg" x1="730" y1="72" x2="730" y2="140"/>
  <rect class="bx" x="580" y="140" width="300" height="60" rx="4"/>
  <text class="t" x="730" y="168">C8 1uF ∥ C13 10uF</text>
  <text class="s" x="730" y="190">输入侧 MLCC（假设2）</text>

  <line class="wg" x1="1160" y1="72" x2="1160" y2="140"/>
  <rect class="bx" x="1010" y="140" width="300" height="60" rx="4"/>
  <text class="t" x="1160" y="168">C12 1uF ∥ C14 10uF</text>
  <text class="s" x="1160" y="190">输出侧 MLCC</text>

  <line x1="580" y1="232" x2="1576" y2="232" stroke="#172033" stroke-width="2.4"/>
  <text class="h" x="24" y="240" fill="#172033">GND</text>
  <line class="wg" x1="730" y1="200" x2="730" y2="232"/>
  <line class="wg" x1="945" y1="102" x2="945" y2="232"/>
  <line class="wg" x1="1160" y1="200" x2="1160" y2="232"/>
  <line class="wg" x1="1480" y1="102" x2="1480" y2="232"/>
</svg>
