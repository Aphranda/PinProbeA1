<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" width="100%" role="img" aria-label="从机供电回路">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#687381"/>
    </marker>
    <style>
      .bx { fill:#f4f6fa; stroke:#687381; stroke-width:1.8; }
      .w  { stroke:#687381; stroke-width:2; fill:none; }
      .wg { stroke:#9aa4b2; stroke-width:1.6; fill:none; }
      .wd { stroke:#9aa4b2; stroke-width:2; fill:none; stroke-dasharray:8 5; }
      .t  { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:25px; font-weight:700; fill:#172033; text-anchor:middle; }
      .ts { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:22px; font-weight:700; fill:#172033; text-anchor:middle; }
      .s  { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:21px; fill:#687381; text-anchor:middle; }
      .h  { font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:24px; font-weight:700; fill:#687381; text-anchor:start; }
      .net{ font-family:"Microsoft YaHei","SimHei",Arial,sans-serif; font-size:23px; font-weight:700; fill:#687381; text-anchor:start; }
    </style>
  </defs>

  <text class="h" x="24" y="24">从机供电回路：仅由 VCC12V 经降压取电（本机未通电，仅作对照）</text>

  <rect class="bx" x="24" y="42" width="120" height="60" rx="4"/>
  <text class="t" x="84" y="70">VCC12V</text>
  <text class="s" x="84" y="92">12V 远供</text>
  <line class="w" x1="144" y1="72" x2="174" y2="72" marker-end="url(#b)"/>
  <rect class="bx" x="178" y="42" width="80" height="60" rx="4"/>
  <text class="t" x="218" y="79">F1</text>
  <line class="w" x1="258" y1="72" x2="288" y2="72" marker-end="url(#b)"/>
  <rect class="bx" x="292" y="42" width="160" height="60" rx="4"/>
  <text class="t" x="372" y="70">U2 降压</text>
  <text class="s" x="372" y="92">L4 2.2uH</text>
  <line class="w" x1="452" y1="72" x2="482" y2="72" marker-end="url(#b)"/>
  <rect class="bx" x="486" y="42" width="170" height="60" rx="4"/>
  <text class="ts" x="571" y="70">VCC5V_OUT</text>
  <text class="s" x="571" y="92">C10/C11 22uF</text>
  <line class="w" x1="656" y1="72" x2="686" y2="72" marker-end="url(#b)"/>
  <rect class="bx" x="690" y="42" width="150" height="60" rx="4"/>
  <text class="ts" x="765" y="70">F2 保险丝</text>
  <text class="s" x="765" y="92">从机贴装</text>
  <line class="w" x1="840" y1="72" x2="906" y2="72"/>
  <circle cx="910" cy="72" r="5" fill="#687381"/>
  <text class="net" x="922" y="124">VCC5V</text>
  <line class="w" x1="910" y1="72" x2="964" y2="72" marker-end="url(#b)"/>

  <rect class="wd" x="956" y="30" width="310" height="84" rx="5"/>
  <rect class="bx" x="968" y="42" width="286" height="60" rx="4"/>
  <text class="t" x="1111" y="70">U3 TPS7A2033</text>
  <text class="s" x="1111" y="92">IN / EN · VIN max 6.5V</text>

  <line class="w" x1="1254" y1="72" x2="1300" y2="72"/>
  <circle cx="1304" cy="72" r="5" fill="#687381"/>
  <text class="net" x="1316" y="124">3.3V</text>
  <line class="w" x1="1304" y1="72" x2="1348" y2="72" marker-end="url(#b)"/>
  <rect class="bx" x="1352" y="42" width="110" height="60" rx="4"/>
  <text class="ts" x="1407" y="79">L2 磁珠</text>
  <line class="w" x1="1462" y1="72" x2="1486" y2="72" marker-end="url(#b)"/>
  <rect class="bx" x="1490" y="42" width="86" height="60" rx="4"/>
  <text class="ts" x="1533" y="68">CH318</text>
  <text class="s" x="1533" y="90">VDD3V3</text>

  <line class="wg" x1="910" y1="72" x2="910" y2="140"/>
  <rect class="bx" x="760" y="140" width="300" height="60" rx="4"/>
  <text class="t" x="910" y="168">C8 1uF ∥ C13 10uF</text>
  <text class="s" x="910" y="190">输入侧 MLCC（假设2）</text>

  <line class="wg" x1="1304" y1="72" x2="1304" y2="140"/>
  <rect class="bx" x="1154" y="140" width="300" height="60" rx="4"/>
  <text class="t" x="1304" y="168">C12 1uF ∥ C14 10uF</text>
  <text class="s" x="1304" y="190">输出侧 MLCC</text>

  <line x1="760" y1="232" x2="1576" y2="232" stroke="#172033" stroke-width="2.4"/>
  <text class="h" x="700" y="240" fill="#172033" text-anchor="end">GND</text>
  <line class="wg" x1="910" y1="200" x2="910" y2="232"/>
  <line class="wg" x1="1110" y1="102" x2="1110" y2="232"/>
  <line class="wg" x1="1304" y1="200" x2="1304" y2="232"/>
  <line class="wg" x1="1533" y1="102" x2="1533" y2="232"/>
</svg>
